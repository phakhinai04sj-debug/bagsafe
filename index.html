<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Airport Kiosk 4.0 PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Inter:wght@300;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
box-sizing:border-box;
font-family:'Inter','Kanit',sans-serif;
}

body{
margin:0;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
text-align:center;
}

/* TOP BAR */

.language-bar{
background:#0f172a;
padding:12px 20px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:100;
box-shadow:0 4px 15px rgba(0,0,0,.4);
}

.left,.right{
display:flex;
align-items:center;
gap:15px;
}

.center{
position:absolute;
left:50%;
transform:translateX(-50%);
}

.menu-btn{
font-size:26px;
background:none;
border:none;
color:white;
cursor:pointer;
}

.menu{
display:none;
position:absolute;
top:55px;
left:20px;
background:#1f2937;
border-radius:10px;
padding:10px;
box-shadow:0 10px 25px rgba(0,0,0,.5);
}

.menu button{
display:block;
width:160px;
margin:5px 0;
padding:8px;
border:none;
border-radius:8px;
background:#374151;
color:white;
cursor:pointer;
}

.language-bar select{
padding:8px 14px;
border-radius:10px;
border:none;
background:#1f2937;
color:white;
}

.clock{
font-size:14px;
opacity:.8;
}

/* HEADER */

header{
padding:40px 20px;
}

.logo{
opacity:.7;
margin-bottom:10px;
}

h1{
font-size:28px;
margin:10px 0;
}

.message{
font-size:22px;
min-height:50px;
font-weight:500;
}

/* CARDS */

.card-group{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
padding:30px;
max-width:1200px;
margin:auto;
}

.card{
border-radius:25px;
height:200px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:18px;
padding:20px;
transition:.3s;
font-weight:500;
background:#374151;
}

.card img{
width:60px;
height:60px;
margin-bottom:10px;
}

.card:hover{
transform:translateY(-6px);
}

/* COLOR AFTER CLICK */

.danger{background:#dc2626;}
.safe{background:#16a34a;}
.unknown{background:#eab308;color:black;}

.admin-panel{
display:none;
background:#1f2937;
margin:40px auto;
padding:30px;
border-radius:20px;
max-width:900px;
}

</style>
</head>

<body>

<script>

/* CLOCK */

setInterval(()=>{
clock.innerText=new Date().toLocaleTimeString()
},1000)

/* MENU */

function toggleMenu(){
let m=document.getElementById("menu")
m.style.display=m.style.display=="block"?"none":"block"
}

/* FULLSCREEN */

function toggleFull(){
if(!document.fullscreenElement){
document.documentElement.requestFullscreen()
}else{
document.exitFullscreen()
}
}

/* ADMIN */

function adminLogin(){
let pass=prompt("Enter Password")
if(pass=="654321"){
document.getElementById("adminPanel").style.display="block"
drawChart()
}else{
alert("Wrong password")
}
}

/* BEEP */

const beep=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg")

/* SPEECH FIX (แก้เสียงญี่ปุ่น) */

let currentLang="th"
let voices=[]

function loadVoices(){
voices=speechSynthesis.getVoices()
}

speechSynthesis.onvoiceschanged=loadVoices

function speak(text){

speechSynthesis.cancel()

let msg=new SpeechSynthesisUtterance(text)

let voice=voices.find(v=>v.lang.toLowerCase().startsWith(currentLang))

if(voice){
msg.voice=voice
}

msg.rate=0.95

speechSynthesis.speak(msg)

}

/* IMAGES (แก้รูปให้ตรง) */

const images=[

"https://cdn-icons-png.flaticon.com/512/190/190411.png",   // safe
"https://cdn-icons-png.flaticon.com/512/1048/1048953.png", // powerbank
"https://cdn-icons-png.flaticon.com/512/3103/3103446.png", // battery
"https://cdn-icons-png.flaticon.com/512/2933/2933245.png", // vape
"https://cdn-icons-png.flaticon.com/512/3474/3474360.png", // laptop
"https://cdn-icons-png.flaticon.com/512/1046/1046784.png", // lighter
"https://cdn-icons-png.flaticon.com/512/616/616490.png",   // explosive
"https://cdn-icons-png.flaticon.com/512/2917/2917990.png", // chemical
"https://cdn-icons-png.flaticon.com/512/3075/3075977.png", // weapon
"https://cdn-icons-png.flaticon.com/512/1828/1828843.png"  // unsure

]

/* STATS */

let stats=JSON.parse(localStorage.getItem("stats")) || Array(10).fill(0)

function saveStats(){
localStorage.setItem("stats",JSON.stringify(stats))
}

function resetData(){
stats=Array(10).fill(0)
saveStats()
alert("Data reset")
}

/* UI */

function loadUI(){

let t=translations[currentLang]

title.innerText=t.title
instruction.innerText=t.instruction

cards.innerHTML=""

t.items.forEach((item,i)=>{

let c=document.createElement("div")

c.className="card"

let img=document.createElement("img")
img.src=images[i]

let text=document.createElement("div")
text.innerText=item

c.appendChild(img)
c.appendChild(text)

c.onclick=()=>selectItem(i,c)

cards.appendChild(c)

})

}

function selectItem(i,card){

let t=translations[currentLang]

stats[i]++
saveStats()

document.querySelectorAll(".card").forEach(el=>{
el.classList.remove("danger","safe","unknown")
})

let text=""

if(i==0){

card.classList.add("safe")
text=t.safe

}else if(i==9){

card.classList.add("unknown")
text=t.ask

}else{

card.classList.add("danger")
beep.play()
text=t.warning

}

message.innerText=text
speak(text)

}

/* START */

loadVoices()
loadUI()

</script>

</body>
</html>
