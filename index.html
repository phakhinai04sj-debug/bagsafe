<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Airport Kiosk 4.5</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{box-sizing:border-box;font-family:Kanit,sans-serif}

body{
margin:0;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
text-align:center
}

.language-bar{
display:flex;
justify-content:center;
padding:15px;
background:#0f172a
}

select{
padding:10px 15px;
border-radius:10px;
border:none
}

header{padding:30px}

.card-group{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:30px;
max-width:1100px;
margin:auto
}

.card{
height:180px;
border-radius:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
transition:.3s
}

.card img{
width:65px;
margin-bottom:10px
}

.card:hover{transform:translateY(-5px)}

.danger{background:#dc2626}
.safe{background:#16a34a}
.unknown{background:#eab308;color:black}

.message{
font-size:22px;
min-height:40px
}

</style>
</head>

<body>

<div class="language-bar">

<select onchange="changeLang(this.value)">

<option value="th">🇹🇭 ไทย</option>
<option value="en">🇺🇸 English</option>
<option value="zh">🇨🇳 中文</option>
<option value="ja">🇯🇵 日本語</option>
<option value="ko">🇰🇷 한국어</option>
<option value="es">🇪🇸 Español</option>
<option value="fr">🇫🇷 Français</option>
<option value="de">🇩🇪 Deutsch</option>
<option value="ru">🇷🇺 Русский</option>
<option value="ar">🇸🇦 العربية</option>
<option value="hi">🇮🇳 हिन्दी</option>

</select>

</div>

<header>

<h1 id="title"></h1>
<div id="instruction"></div>
<div class="message" id="message"></div>

</header>

<div class="card-group" id="cards"></div>

<script>

/* LANGUAGE */

let currentLang="th"

/* SPEECH */

let voices=[]

speechSynthesis.onvoiceschanged=()=>{

voices=speechSynthesis.getVoices()

}

function speak(text){

speechSynthesis.cancel()

let msg=new SpeechSynthesisUtterance(text)

let voice=voices.find(v=>v.lang.toLowerCase().startsWith(currentLang))

if(voice){msg.voice=voice}

msg.rate=0.95

speechSynthesis.speak(msg)

}

/* ICONS */

const images=[

"https://cdn-icons-png.flaticon.com/512/1048/1048953.png",
"https://cdn-icons-png.flaticon.com/512/3103/3103446.png",
"https://cdn-icons-png.flaticon.com/512/2933/2933245.png",
"https://cdn-icons-png.flaticon.com/512/3474/3474360.png",
"https://cdn-icons-png.flaticon.com/512/1046/1046784.png",
"https://cdn-icons-png.flaticon.com/512/616/616490.png",
"https://cdn-icons-png.flaticon.com/512/2917/2917990.png",
"https://cdn-icons-png.flaticon.com/512/3075/3075977.png",
"https://cdn-icons-png.flaticon.com/512/1828/1828843.png",
"https://cdn-icons-png.flaticon.com/512/190/190411.png"

]

/* TRANSLATIONS */

const translations={

th:{
title:"สิ่งของห้ามโหลดใต้ท้องเครื่อง",
instruction:"กรุณาเลือกสิ่งของในกระเป๋า",
items:["พาวเวอร์แบงค์","แบตเตอรี่","บุหรี่ไฟฟ้า","โน้ตบุ๊ก","ไฟแช็ก","วัตถุระเบิด","สารเคมี","อาวุธ","ไม่แน่ใจ","ไม่มีวัตถุอันตราย"],
warning:"ห้ามโหลดใต้เครื่อง กรุณาถือขึ้นเครื่อง",
ask:"กรุณาสอบถามเจ้าหน้าที่",
safe:"ไม่มีวัตถุอันตราย"
},

en:{
title:"Prohibited Items in Checked Baggage",
instruction:"Please select item in your bag",
items:["Power Bank","Battery","E-Cigarette","Laptop","Lighter","Explosive","Chemical","Weapon","Unsure","No Dangerous Items"],
warning:"Not allowed in checked baggage",
ask:"Please ask airport staff",
safe:"No dangerous items"
},

zh:{
title:"托运行李禁止物品",
instruction:"请选择物品",
items:["充电宝","电池","电子烟","笔记本电脑","打火机","爆炸物","化学品","武器","不确定","没有危险物品"],
warning:"禁止托运 请随身携带",
ask:"请咨询工作人员",
safe:"没有危险物品"
},

ja:{
title:"預け荷物禁止物",
instruction:"物品を選択してください",
items:["モバイルバッテリー","電池","電子タバコ","ノートパソコン","ライター","爆発物","化学物質","武器","不明","危険物なし"],
warning:"預け入れ不可 機内持ち込み",
ask:"係員にお尋ねください",
safe:"危険物はありません"
},

ko:{
title:"위탁 수하물 금지 물품",
instruction:"물품을 선택하세요",
items:["보조배터리","배터리","전자담배","노트북","라이터","폭발물","화학물질","무기","모름","위험물 없음"],
warning:"위탁 수하물 금지",
ask:"직원에게 문의",
safe:"위험물 없음"
},

es:{
title:"Artículos prohibidos",
instruction:"Seleccione un artículo",
items:["Batería portátil","Batería","Cigarrillo electrónico","Portátil","Encendedor","Explosivo","Químico","Arma","No seguro","Sin peligro"],
warning:"No permitido",
ask:"Pregunte al personal",
safe:"Sin peligro"
},

fr:{
title:"Articles interdits",
instruction:"Sélectionnez un article",
items:["Batterie externe","Batterie","Cigarette électronique","Ordinateur","Briquet","Explosif","Produit chimique","Arme","Pas sûr","Aucun danger"],
warning:"Interdit en soute",
ask:"Demandez au personnel",
safe:"Aucun danger"
},

de:{
title:"Verbotene Gegenstände",
instruction:"Artikel wählen",
items:["Powerbank","Batterie","E-Zigarette","Laptop","Feuerzeug","Explosivstoff","Chemikalie","Waffe","Unsicher","Keine Gefahr"],
warning:"Nicht erlaubt",
ask:"Personal fragen",
safe:"Keine Gefahr"
},

ru:{
title:"Запрещённые предметы",
instruction:"Выберите предмет",

warning:"Запрещено",
ask:"Спросите сотрудника",
safe:"Нет опасности"
},

ar:{
title:"مواد محظورة",
instruction:"اختر العنصر",
items:["بنك طاقة","بطارية","سيجارة إلكترونية","كمبيوتر","ولاعة","متفجرات","مواد كيميائية","سلاح","غير متأكد","لا يوجد خطر"],
warning:"ممنوع",
ask:"اسأل الموظف",
safe:"لا يوجد خطر"
},

hi:{
title:"प्रतिबंधित वस्तुएँ",
instruction:"वस्तु चुनें",
items:["पावर बैंक","बैटरी","ई-सिगरेट","लैपटॉप","लाइटर","विस्फोटक","रसायन","हथियार","पता नहीं","कोई खतरा नहीं"],
warning:"अनुमति नहीं",
ask:"स्टाफ से पूछें",
safe:"कोई खतरा नहीं"
}

}

/* UI */

function changeLang(lang){

currentLang=lang

loadUI()

}

function loadUI(){

let t=translations[currentLang]

title.innerText=t.title
instruction.innerText=t.instruction

cards.innerHTML=""

t.items.forEach((item,i)=>{

let c=document.createElement("div")

c.className="card"

if(i==9){c.classList.add("safe")}
else if(i==8){c.classList.add("unknown")}
else{c.classList.add("danger")}

let img=document.createElement("img")
img.src=images[i]

let text=document.createElement("div")
text.innerText=item

c.appendChild(img)
c.appendChild(text)

c.onclick=()=>selectItem(i)

cards.appendChild(c)

})

}

function selectItem(i){

let t=translations[currentLang]

let text=""

if(i==9){text=t.safe}
else if(i==8){text=t.ask}
else{text=t.warning}

message.innerText=text

speak(text)

}

/* START */

loadUI()

</script>

</body>
</html>
