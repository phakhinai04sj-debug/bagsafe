<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Airport Smart Kiosk</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a2a66;
color:white;
}

/* HEADER */

header{
background:#041b44;
padding:20px;
font-size:26px;
text-align:center;
}

/* MENU BUTTON */

#menuButton{
position:fixed;
left:15px;
top:15px;
font-size:32px;
cursor:pointer;
}

/* SIDE MENU */

#sideMenu{
position:fixed;
left:-250px;
top:0;
width:250px;
height:100%;
background:#02122f;
padding-top:60px;
transition:0.3s;
}

#sideMenu button{
width:100%;
padding:15px;
border:none;
background:none;
color:white;
text-align:left;
font-size:18px;
cursor:pointer;
}

/* CONTENT */

.container{
padding:30px;
text-align:center;
}

.languages button{
margin:5px;
padding:10px;
font-size:16px;
border:none;
border-radius:6px;
cursor:pointer;
}

input{
padding:15px;
font-size:18px;
width:60%;
border-radius:8px;
border:none;
}

.check{
padding:15px 30px;
font-size:18px;
background:#00c853;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:24px;
}

img{
margin-top:20px;
width:220px;
border-radius:10px;
}

</style>
</head>

<body>

<div id="menuButton" onclick="toggleMenu()">☰</div>

<div id="sideMenu">

<button onclick="showPage('home')">Home</button>
<button onclick="showPage('check')">Check Baggage</button>
<button onclick="showPage('prohibited')">Prohibited Items</button>
<button onclick="showPage('info')">Airport Info</button>

</div>

<header>✈️ Airport Smart Security Kiosk</header>

<div class="container" id="content">

<h2 id="title">Select Language</h2>

<div class="languages">

<button onclick="setLang('en')">🇺🇸</button>
<button onclick="setLang('th')">🇹🇭</button>
<button onclick="setLang('zh')">🇨🇳</button>
<button onclick="setLang('ja')">🇯🇵</button>
<button onclick="setLang('ko')">🇰🇷</button>
<button onclick="setLang('es')">🇪🇸</button>
<button onclick="setLang('fr')">🇫🇷</button>
<button onclick="setLang('de')">🇩🇪</button>
<button onclick="setLang('ru')">🇷🇺</button>
<button onclick="setLang('ar')">🇸🇦</button>
<button onclick="setLang('hi')">🇮🇳</button>

</div>

<br>

<input id="item" placeholder="Type item e.g. laptop">

<br><br>

<button class="check" onclick="checkItem()">Check Item</button>

<div class="result" id="result"></div>

<img id="itemImage" style="display:none">

</div>

<script>

/* LANGUAGE */

let lang="en"

const texts={

en:{yes:"Allowed in cabin",no:"Not allowed in cabin"},
th:{yes:"นำขึ้นเครื่องได้",no:"ห้ามนำขึ้นเครื่อง"},
zh:{yes:"可以携带",no:"禁止携带"},
ja:{yes:"機内持ち込み可能",no:"機内持ち込み禁止"},
ko:{yes:"기내 반입 가능",no:"기내 반입 금지"},
es:{yes:"Permitido",no:"No permitido"},
fr:{yes:"Autorisé",no:"Interdit"},
de:{yes:"Erlaubt",no:"Verboten"},
ru:{yes:"Разрешено",no:"Запрещено"},
ar:{yes:"مسموح",no:"ممنوع"},
hi:{yes:"अनुमति है",no:"अनुमति नहीं"}

}

function setLang(l){

lang=l

}

/* SPEECH */

function speak(text){

let msg=new SpeechSynthesisUtterance(text)

msg.lang=lang

speechSynthesis.speak(msg)

}

/* ITEMS DATABASE */

const items={

"knife":false,
"gun":false,
"battery":false,
"power bank":true,
"laptop":true,
"perfume":true

}

const images={

"knife":"https://upload.wikimedia.org/wikipedia/commons/3/3f/Knife.jpg",
"gun":"https://upload.wikimedia.org/wikipedia/commons/1/19/Pistol.jpg",
"battery":"https://upload.wikimedia.org/wikipedia/commons/3/3a/Lithium_battery.jpg",
"power bank":"https://upload.wikimedia.org/wikipedia/commons/5/55/Powerbank.jpg",
"laptop":"https://upload.wikimedia.org/wikipedia/commons/6/6a/MacBook_Pro.jpg",
"perfume":"https://upload.wikimedia.org/wikipedia/commons/7/73/Perfume.jpg"

}

/* CHECK ITEM */

function checkItem(){

let item=document.getElementById("item").value.toLowerCase()

let result=document.getElementById("result")

let img=document.getElementById("itemImage")

if(items[item]===undefined){

result.innerText="Item not found"
speak(result.innerText)
return

}

if(items[item]){

result.innerText=texts[lang].yes

}else{

result.innerText=texts[lang].no

}

img.src=images[item]
img.style.display="block"

speak(result.innerText)

}

/* MENU */

function toggleMenu(){

let menu=document.getElementById("sideMenu")

if(menu.style.left=="0px"){

menu.style.left="-250px"

}else{

menu.style.left="0px"

}

}

function showPage(p){

toggleMenu()

}

</script>

</body>
</html>
